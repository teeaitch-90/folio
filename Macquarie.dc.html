<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { scale: 1, fw: 1440, fh: 13745 };
  componentDidMount() {
    const scaler = document.querySelector('[data-scaler]');
    if (!scaler) return;
    const viewport = scaler.parentElement;
    const outer = viewport.parentElement;
    const measure = () => {
      const cw = outer.clientWidth;
      const scale = Math.min(1, cw / 1440);
      const nat = scaler.scrollHeight || 13745;
      this.setState({ scale, fw: Math.round(1440 * scale), fh: Math.round(nat * scale) });
    };
    this._ro = new ResizeObserver(measure);
    this._ro.observe(outer);
    this._ro.observe(scaler);
    [200, 600, 1200, 2500, 4000, 6000].forEach(t => setTimeout(measure, t));
    window.addEventListener('load', measure);
  }
  componentWillUnmount() { if (this._ro) this._ro.disconnect(); }
  renderVals() { return { scale: this.state.scale, fw: this.state.fw, fh: this.state.fh }; }
}
</script>
